[tool.poetry]
name = "rfsynth"
version = "0.1.0"
description = "Python-native RF scene generation, verification, and replay tooling"
authors = ["Dinesh Bharadia <dineshb@ucsd.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^2.0.0"
matplotlib = "^3.9.0"
PyYAML = "^6.0.2"
scipy = "^1.14.0"
zmq = "^0.0.0"

[tool.poetry.scripts]
rfsynth = "rfsynth.cli:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
